<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>婚礼流程 · 喜乐时间轴</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #fceae3 0%, #ffe9d4 100%);
      font-family: 'Segoe UI', 'Noto Serif SC', 'Times New Roman', 楷体, KaiTi, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.2rem;
      margin: 0;
      position: relative;
    }
    /* 喜庆背景装饰 */
    body::before {
      content: "囍";
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 6rem;
      color: rgba(220, 80, 60, 0.08);
      font-weight: bold;
      z-index: 0;
      pointer-events: none;
      font-family: "KaiTi", "楷体", serif;
    }
    body::after {
      content: "⚭";
      position: fixed;
      bottom: 15px;
      left: 25px;
      font-size: 7rem;
      color: rgba(200, 120, 70, 0.06);
      z-index: 0;
      pointer-events: none;
    }
    .container {
      max-width: 620px;
      width: 100%;
      background: rgba(255, 242, 230, 0.9);
      backdrop-filter: blur(20px);
      background: #fff5e8;
      border-radius: 3.8rem 3.8rem 3.2rem 3.2rem;
      box-shadow: 0 35px 55px rgba(180, 80, 40, 0.2), 0 12px 28px rgba(160, 70, 30, 0.15);
      padding: 2.2rem 1.6rem 2.4rem;
      border: 2px solid rgba(235, 155, 100, 0.5);
      position: relative;
      z-index: 2;
      transition: all 0.2s ease;
    }
    /* 标题样式 - 喜字装饰 */
    .header {
      text-align: center;
      margin-bottom: 2.2rem;
      position: relative;
    }
    .header h1 {
      font-size: 2.5rem;
      font-weight: 500;
      color: #c43d2c;
      letter-spacing: 5px;
      font-family: "Noto Serif SC", "楷体", KaiTi, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
      text-shadow: 2px 2px 0 rgba(255, 215, 180, 0.6);
    }
    .header h1 .xi-char {
      font-size: 2.8rem;
      color: #d6341c;
      font-weight: bold;
      font-family: "KaiTi", "楷体", serif;
      filter: drop-shadow(0 4px 6px rgba(200, 50, 20, 0.4));
      line-height: 1;
    }
    .subhead {
      color: #b1442a;
      font-size: 1rem;
      background: linear-gradient(to right, #ffded0, #ffe1c6, #ffded0);
      display: inline-block;
      padding: 0.4rem 2.2rem;
      letter-spacing: 3px;
      margin-top: 0.4rem;
      border-radius: 30px;
      font-weight: 500;
      border: 1px solid #e09b7a;
      box-shadow: 0 6px 10px rgba(210, 90, 40, 0.15);
    }
    /* 时间轴主体 */
    .timeline {
      position: relative;
      padding-left: 2.5rem;
      margin: 1.8rem 0 2rem;
    }
    /* 垂直轴线 - 喜庆渐变 */
    .timeline::before {
      content: '';
      position: absolute;
      left: 1.35rem;
      top: 0.5rem;
      bottom: 0.5rem;
      width: 4px;
      background: linear-gradient(to bottom, #f5b07b, #e07a3d, #c4492a, #e07a3d, #f5b07b);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(240, 110, 50, 0.5);
    }
    .event {
      display: flex;
      align-items: flex-start;
      margin-bottom: 2rem;
      position: relative;
      word-break: break-word;
    }
    .event:last-child {
      margin-bottom: 0.2rem;
    }
    /* 圆点标记 - 根据状态会有不同颜色类 */
    .dot {
      position: absolute;
      left: -1.82rem;
      top: 0.45rem;
      width: 1.5rem;
      height: 1.5rem;
      background: #fff5e6;
      border: 3px solid #d9783b;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(245, 160, 90, 0.4);
      background: white;
      z-index: 3;
      transition: all 0.3s ease;
      background: radial-gradient(circle at 30% 30%, #fff, #ffd9b5);
    }
    /* 当前时间点之后的点变暗？用类控制更明显 */
    .dot.past-dot {
      border-color: #c46b4a;
      background: #ffe0ce;
      box-shadow: 0 0 0 5px rgba(210, 110, 50, 0.35);
    }
    .dot.current-dot {
      border-color: #d6341c;
      background: #ffbe8c;
      box-shadow: 0 0 0 8px rgba(240, 100, 40, 0.6);
      animation: pulseGlow 1.4s infinite;
      width: 1.7rem;
      height: 1.7rem;
      left: -1.92rem;
      top: 0.35rem;
    }
    .dot.future-dot {
      border-color: #e6a576;
      background: #fff5ed;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 6px rgba(230, 90, 30, 0.55); }
      50% { box-shadow: 0 0 0 12px rgba(240, 120, 50, 0.3); }
      100% { box-shadow: 0 0 0 6px rgba(230, 90, 30, 0.55); }
    }
    .content {
      background: #ffffff;
      border-radius: 1.8rem 1.8rem 1.8rem 0.6rem;
      padding: 0.9rem 1.4rem;
      box-shadow: 0 8px 18px rgba(180, 80, 35, 0.12);
      border: 1px solid #fad7b6;
      flex: 1;
      transition: all 0.25s ease;
      margin-left: 0.6rem;
      backdrop-filter: blur(2px);
      position: relative;
    }
    .event:hover .content {
      box-shadow: 0 14px 24px rgba(190, 85, 30, 0.2);
      border-color: #e07a3f;
      transform: translateY(-2px);
    }
    .time {
      font-weight: 700;
      font-size: 1.3rem;
      color: #a43d24;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      margin-bottom: 0.35rem;
      letter-spacing: 0.5px;
    }
    .time-icon {
      font-size: 1.1rem;
      color: #d9662c;
    }
    .desc {
      font-size: 1rem;
      color: #4d3322;
      line-height: 1.5;
      font-weight: 500;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }
    .desc i {
      margin-right: 0.3rem;
      opacity: 0.8;
      font-style: normal;
    }
    /* 备注样式 */
    .remark {
      font-size: 0.8rem;
      color: #b7472a;
      background: #ffefe2;
      border-radius: 20px;
      padding: 0.25rem 0.9rem;
      margin-top: 0.5rem;
      display: inline-block;
      border-left: 3px solid #e07a3f;
      font-style: italic;
      background: rgba(255, 200, 140, 0.2);
    }
    .edit-controls {
      display: flex;
      justify-content: flex-end;
      gap: 0.7rem;
      margin-top: 0.8rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .btn {
      background: transparent;
      border: 1px solid #db9e72;
      color: #994422;
      padding: 0.5rem 1.3rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      cursor: pointer;
      background: #fff7ef;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .btn:hover {
      background: #ffe0cd;
      border-color: #c06430;
      color: #6b2e17;
    }
    .btn.primary {
      background: #e07a3f;
      border-color: #c1552a;
      color: white;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(210, 80, 30, 0.3);
    }
    .btn.primary:hover {
      background: #cc5f2b;
    }
    .hidden {
      display: none !important;
    }
    .edit-input {
      border: 1px solid #e0ae81;
      border-radius: 1.2rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.95rem;
      width: 100%;
      background: #fffcf7;
      font-family: inherit;
      color: #402c1e;
      margin: 0.25rem 0 0.5rem;
      outline: none;
      transition: 0.2s;
    }
    .edit-input:focus {
      border-color: #c45a2c;
      box-shadow: 0 0 0 3px rgba(220, 110, 50, 0.3);
    }
    .time-edit-row {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      margin-bottom: 0.3rem;
    }
    .save-item-btn {
      background: none;
      border: none;
      color: #b14122;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
    }
    .note {
      font-size: 0.8rem;
      color: #c2613a;
      text-align: center;
      margin-top: 1.3rem;
      font-style: italic;
      background: #ffe0cf;
      padding: 0.3rem;
      border-radius: 20px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.3rem;
      padding-right: 1.3rem;
    }
    .current-badge {
      background: #d6341c;
      color: white;
      border-radius: 12px;
      padding: 0.15rem 0.7rem;
      font-size: 0.7rem;
      margin-left: 0.5rem;
      font-weight: bold;
    }
    @media (max-width: 400px) {
      .container {
        padding: 1.5rem 0.9rem;
      }
    }
  </style>
</head>
<body>
<div class="container" id="appContainer">
  <div class="header">
    <h1>
      <span class="xi-char">囍</span> 王仲宝&卓丹燕 <span class="xi-char">囍</span>
    </h1>
    <div class="subhead">· 囍 · 婚礼流程 · 囍 ·</div>
  </div>

  <div class="timeline" id="timelineContainer"></div>

  <div class="edit-controls" id="editControls">
    <button class="btn" id="toggleEditBtn">
      <span>✎</span> 编辑流程
    </button>
    <button class="btn primary hidden" id="addEventBtn">
      <span>+</span> 添加事项
    </button>
    <button class="btn hidden" id="saveAllBtn" style="background:#c43d2c; color:white; border-color:#a6341e;">
      <span>✓</span> 完成编辑
    </button>
  </div>
  <div class="note" id="statusNote">
    🧧 良辰吉时 · 只读模式
  </div>
</div>

<script>
  (function() {
    // ---------- 更丰富的初始数据，包含备注和颜色标记可能 ----------
    const INITIAL_EVENTS = [
      { id: 'e1', time: '8:00', description: '车队集合、接亲人集合', remark: '装饰花车，核对路线' },
      { id: 'e2', time: '8:30', description: '结亲队伍出发', remark: '放礼花，喜糖带上' },
      { id: 'e3', time: '9:30', description: '到达酒店，结亲互动游戏', remark: '堵门游戏，欢乐时刻' },
      { id: 'e4', time: '10:20', description: '结亲团队返回', remark: '车队注意队形' },
      { id: 'e5', time: '11:30', description: '进入新郎家里，敬茶', remark: '改口茶，红包准备' },
      { id: 'e6', time: '12:12', description: '开始午宴', remark: '良辰开席' }
    ];

    const STORAGE_KEY = 'wedding_timeline_v2';

    let events = [];
    let isEditMode = false;
    let nextId = 1;

    const timelineContainer = document.getElementById('timelineContainer');
    const toggleEditBtn = document.getElementById('toggleEditBtn');
    const addEventBtn = document.getElementById('addEventBtn');
    const saveAllBtn = document.getElementById('saveAllBtn');
    const statusNote = document.getElementById('statusNote');

    // 加载数据
    function loadEventsFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map((ev, idx) => {
              if (!ev.id) return { ...ev, id: 'e' + Date.now() + idx };
              return ev;
            });
          }
        }
      } catch (e) {}
      return INITIAL_EVENTS.map(ev => ({ ...ev }));
    }

    function saveEventsToStorage(eventsArray) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(eventsArray));
    }

    function updateNextId() {
      let maxNum = 0;
      events.forEach(ev => {
        const match = ev.id?.match(/^e(\d+)/);
        if (match) {
          const num = parseInt(match[1], 10);
          if (num > maxNum) maxNum = num;
        }
      });
      nextId = maxNum + 1;
    }

    function generateId() {
      return 'e' + (nextId++);
    }

    // 获取当前时间字符串 HH:MM
    function getCurrentTimeString() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    // 重新计算每个事件的状态（基于排序后位置）
    function computeStatuses(sortedEvents, currentTime) {
      const statuses = new Map();
      let currentAssigned = false;
      for (let i = 0; i < sortedEvents.length; i++) {
        const ev = sortedEvents[i];
        const time = ev.time || '0:00';
        const comp = time.localeCompare(currentTime, undefined, { numeric: true });
        if (comp < 0) {
          statuses.set(ev.id, 'past');
        } else if (comp === 0) {
          statuses.set(ev.id, 'current');
          currentAssigned = true;
        } else {
          if (!currentAssigned) {
            statuses.set(ev.id, 'current');
            currentAssigned = true;
          } else {
            statuses.set(ev.id, 'future');
          }
        }
      }
      return statuses;
    }

    function renderTimeline() {
      if (!timelineContainer) return;
      if (!events.length) {
        timelineContainer.innerHTML = `<div style="text-align:center; color:#b95a3a; padding:1.5rem; background:#fff2e6; border-radius:2rem;">✨ 暂无流程，点击编辑添加喜事 ✨</div>`;
        return;
      }

      const sortedEvents = [...events].sort((a, b) => {
        return (a.time || '0:00').localeCompare(b.time || '0:00', undefined, { numeric: true });
      });

      const currentTime = getCurrentTimeString();
      const statusMap = computeStatuses(sortedEvents, currentTime);

      let html = '';
      sortedEvents.forEach((ev) => {
        const timeText = ev.time || '??:??';
        const descText = ev.description || '未填写';
        const remarkText = ev.remark || '';
        const status = statusMap.get(ev.id) || 'future';
        
        if (isEditMode) {
          html += `
            <div class="event" data-id="${ev.id}">
              <div class="dot"></div>
              <div class="content">
                <div class="time-edit-row">
                  <input class="edit-input time-input" type="text" value="${escapeHtml(timeText)}" placeholder="时间" style="width:80px;">
                  <span style="color:#c44b2c;">⏱️</span>
                </div>
                <input class="edit-input desc-input" type="text" value="${escapeHtml(descText)}" placeholder="事项描述">
                <input class="edit-input remark-input" type="text" value="${escapeHtml(remarkText)}" placeholder="备注(可选)">
                <div style="display:flex; justify-content:flex-end; margin-top:0.3rem;">
                  <button class="save-item-btn delete-event-btn" title="删除">🗑️</button>
                </div>
              </div>
            </div>
          `;
        } else {
          let dotClass = 'dot';
          if (status === 'past') dotClass += ' past-dot';
          else if (status === 'current') dotClass += ' current-dot';
          else dotClass += ' future-dot';

          let currentMarker = '';
          if (status === 'current') {
            currentMarker = '<span class="current-badge">进行中</span>';
          }

          html += `
            <div class="event" data-id="${ev.id}">
              <div class="${dotClass}"></div>
              <div class="content">
                <div class="time">
                  <span class="time-icon">🕗</span> ${escapeHtml(timeText)} ${currentMarker}
                </div>
                <div class="desc">
                  <i>🧧</i> ${escapeHtml(descText)}
                </div>
                ${remarkText ? `<div class="remark">📌 ${escapeHtml(remarkText)}</div>` : ''}
              </div>
            </div>
          `;
        }
      });

      timelineContainer.innerHTML = html;
      if (isEditMode) {
        attachEditEvents();
      }
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function attachEditEvents() {
      if (!timelineContainer) return;
      document.querySelectorAll('.delete-event-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const eventDiv = this.closest('.event');
          if (eventDiv) {
            const id = eventDiv.getAttribute('data-id');
            if (id) deleteEventById(id);
          }
        });
      });
    }

    function deleteEventById(id) {
      if (!isEditMode) return;
      events = events.filter(ev => ev.id !== id);
      saveEventsToStorage(events);
      renderTimeline();
      updateNextId();
    }

    function collectEditedData() {
      if (!timelineContainer) return;
      const eventDivs = timelineContainer.querySelectorAll('.event');
      const newEvents = [];
      eventDivs.forEach(div => {
        const id = div.getAttribute('data-id');
        const timeInput = div.querySelector('.time-input');
        const descInput = div.querySelector('.desc-input');
        const remarkInput = div.querySelector('.remark-input');
        if (timeInput && descInput) {
          newEvents.push({
            id: id || generateId(),
            time: timeInput.value.trim() || '0:00',
            description: descInput.value.trim() || '事项',
            remark: remarkInput ? remarkInput.value.trim() : ''
          });
        } else {
          const existing = events.find(ev => ev.id === id);
          if (existing) newEvents.push({...existing});
        }
      });
      events = newEvents;
      saveEventsToStorage(events);
      updateNextId();
    }

    function addNewEvent() {
      if (!isEditMode) return;
      events.push({
        id: generateId(),
        time: '13:00',
        description: '喜庆新事项',
        remark: ''
      });
      saveEventsToStorage(events);
      renderTimeline();
    }

    function setEditMode(enable) {
      if (enable === isEditMode) return;
      if (enable) {
        isEditMode = true;
        toggleEditBtn.classList.add('hidden');
        addEventBtn.classList.remove('hidden');
        saveAllBtn.classList.remove('hidden');
        statusNote.innerHTML = '✍️ 编辑模式 · 修改时间/备注，完成后保存';
        statusNote.style.color = '#b33a1c';
        renderTimeline();
      } else {
        collectEditedData();
        isEditMode = false;
        toggleEditBtn.classList.remove('hidden');
        addEventBtn.classList.add('hidden');
        saveAllBtn.classList.add('hidden');
        statusNote.innerHTML = '🧧 良辰吉时 · 只读模式';
        statusNote.style.color = '#c2613a';
        renderTimeline();
        saveEventsToStorage(events);
      }
    }

    // 每分钟自动刷新时间轴状态（动态高亮）
    let autoRefreshInterval = null;
    function startAutoRefresh() {
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(() => {
        if (!isEditMode && events.length > 0) {
          renderTimeline(); // 只读模式下刷新圆点状态
        }
      }, 30000); // 30秒检查一次
    }

    function init() {
      events = loadEventsFromStorage();
      updateNextId();
      isEditMode = false;
      toggleEditBtn.classList.remove('hidden');
      addEventBtn.classList.add('hidden');
      saveAllBtn.classList.add('hidden');
      statusNote.innerHTML = '🧧 良辰吉时 · 只读模式';
      renderTimeline();

      toggleEditBtn.addEventListener('click', () => setEditMode(true));
      saveAllBtn.addEventListener('click', () => setEditMode(false));
      addEventBtn.addEventListener('click', () => {
        if (isEditMode) addNewEvent();
      });

      startAutoRefresh();
      window.addEventListener('beforeunload', () => {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  })();
</script>
</body>
</html>
